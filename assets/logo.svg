<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- macOS Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Subtle Inner Glass Rim -->
    <linearGradient id="rimGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Primary Cyan-Indigo Ring Gradient -->
    <linearGradient id="ringGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Sparkle / Sweep Accent Gradient -->
    <linearGradient id="sparkleGrad" x1="200" y1="140" x2="380" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Ambient Cyan Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Center Emblem -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS App Icon Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bgGrad)"/>
  <rect x="30" y="30" width="452" height="452" rx="102" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Ambient Inner Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#ambientGlow)"/>

  <!-- Decorative Grid Lines (Subtle Apple Utility Aesthetic) -->
  <circle cx="256" cy="256" r="168" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="134" stroke="#ffffff" stroke-opacity="0.08" stroke-width="20"/>

  <!-- Glowing Storage & Speed Gauge Ring -->
  <circle cx="256" cy="256" r="134"
          stroke="url(#ringGrad)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-dasharray="610 842"
          transform="rotate(-135 256 256)"
          filter="url(#glowFilter)"/>

  <!-- Inner Frosted Core Disc -->
  <circle cx="256" cy="256" r="94" fill="#111827" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Center Lightning / Clean Sweep Bolt -->
  <path d="M270 166L198 264H256L242 346L314 248H256L270 166Z"
        fill="url(#sparkleGrad)"
        stroke="#E0F2FE"
        stroke-width="3"
        stroke-linejoin="round"
        filter="url(#glowFilter)"/>

  <!-- Crisp Four-Point Star Sparkle (Top Right) -->
  <path d="M366 112L373 135L396 142L373 149L366 172L359 149L336 142L359 135L366 112Z"
        fill="#38BDF8"/>
  <circle cx="366" cy="142" r="4" fill="#FFFFFF"/>

  <!-- Secondary Mini Sparkle (Bottom Left) -->
  <path d="M148 340L152 353L165 357L152 361L148 374L144 361L131 357L144 353L148 340Z"
        fill="#A855F7"/>
</svg>
