<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mac-cleaner Companion</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      background: rgba(14, 18, 28, 0.96) !important;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      color: #f8fafc;
      padding: 16px;
      margin: 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      user-select: none;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .companion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 12px;
    }

    .companion-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
    }

    .companion-brand-icon {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border-subtle);
    }

    .stat-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .stat-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .companion-actions {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }

    .companion-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
    }

    .companion-dropzone {
      border: 1.5px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .companion-dropzone:hover, .companion-dropzone.drag-over {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
    }

    .companion-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .footer-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <!-- Menu Bar Companion Header -->
  <div class="companion-header">
    <div class="companion-brand">
      <img src="logo.png" alt="mac-cleaner" width="22" height="22" style="border-radius: 5px; display: block;">
      <span>mac-cleaner</span>
    </div>
    <span class="badge-tag tag-success" style="font-size: 10px; padding: 2px 6px;">
      <span class="status-dot" style="width: 6px; height: 6px;"></span> Canlı Takip
    </span>
  </div>

  <!-- RAM Row -->
  <div class="stat-row">
    <div class="stat-left">
      <div class="stat-icon" style="background: rgba(168, 85, 247, 0.15); color: var(--accent-purple);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="6" y1="19" x2="6" y2="21"/><line x1="10" y1="19" x2="10" y2="21"/><line x1="14" y1="19" x2="14" y2="21"/><line x1="18" y1="19" x2="18" y2="21"/></svg>
      </div>
      <div class="stat-text">
        <div class="stat-label">RAM Kullanımı</div>
        <div class="stat-sub" id="companionRamText">-- GB / -- GB</div>
      </div>
    </div>
    <span class="size-pill" id="companionRamPercent">--%</span>
  </div>

  <!-- Disk Row -->
  <div class="stat-row">
    <div class="stat-left">
      <div class="stat-icon" style="background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      </div>
      <div class="stat-text">
        <div class="stat-label">Depolama Alanı</div>
        <div class="stat-sub" id="companionDiskText">-- GB Boş</div>
      </div>
    </div>
    <span class="size-pill" id="companionDiskPercent">--%</span>
  </div>

  <!-- Quick Action Buttons -->
  <div class="companion-actions">
    <button class="btn btn-primary companion-btn" id="btnCompanionPurgeRam">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      RAM Boşalt
    </button>
    <button class="btn btn-secondary companion-btn" id="btnCompanionEmptyTrash">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      Çöpü Boşalt
    </button>
  </div>

  <!-- Drag & Drop Zone -->
  <div class="companion-dropzone" id="companionMiniDropzone">
    <div style="color: var(--accent-cyan); margin-bottom: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
    </div>
    <div style="font-size: 11.5px; font-weight: 600;">Dosyayı Buraya Sürükle</div>
    <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">Güvenle Çöp Kutusuna taşır</div>
  </div>

  <!-- Footer Actions -->
  <div class="companion-footer">
    <button class="footer-btn" id="btnOpenMainWindow">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      Ana Pencereyi Aç
    </button>
    <button class="footer-btn" id="btnQuitApp">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Çıkış
    </button>
  </div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/system/stats');
        const data = await res.json();
        if (!data.success) return;

        const { memory, disk } = data;
        if (memory) {
          document.getElementById('companionRamText').textContent = `${memory.formatted.used} / ${memory.formatted.total}`;
          document.getElementById('companionRamPercent').textContent = `${memory.usagePercent}%`;
        }
        if (disk) {
          document.getElementById('companionDiskText').textContent = `${disk.formatted.used} / ${disk.formatted.total} (${disk.formatted.available} Boş)`;
          document.getElementById('companionDiskPercent').textContent = `${disk.usagePercent}%`;
        }
      } catch (e) {}
    }

    loadStats();
    setInterval(loadStats, 3000);

    document.getElementById('btnCompanionPurgeRam')?.addEventListener('click', async () => {
      await fetch('/api/system/purge-ram', { method: 'POST' });
      loadStats();
    });

    document.getElementById('btnCompanionEmptyTrash')?.addEventListener('click', async () => {
      await fetch('/api/system/empty-trash', { method: 'POST' });
      loadStats();
    });

    document.getElementById('btnOpenMainWindow')?.addEventListener('click', () => {
      if (window.electronAPI) {
        window.electronAPI.openMainWindow();
      }
    });

    document.getElementById('btnQuitApp')?.addEventListener('click', () => {
      if (window.electronAPI) {
        window.electronAPI.quitApp();
      }
    });

    // Dropzone
    const dropzone = document.getElementById('companionMiniDropzone');
    if (dropzone) {
      ['dragenter', 'dragover'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.add('drag-over');
        });
      });
      ['dragleave', 'drop'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.remove('drag-over');
        });
      });
      dropzone.addEventListener('drop', async (e) => {
        const files = Array.from(e.dataTransfer.files);
        for (const f of files) {
          if (f.path) {
            await fetch('/api/action/trash', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ targetPath: f.path })
            });
          }
        }
        loadStats();
      });
    }
  </script>
</body>
</html>
